<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TLS Handshake @alex.cyberx</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* Theme-aware (green / blue / red): accent follows the site theme via ?theme=
   and a parent postMessage. TLS is the defence, so the whole flow is the
   accent colour; there is no attacker path here. */
:root{
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --bg:#0b0d0d;
  --text:#d7dcda; --dim:#8b938f; --faint:#5c6460;
  --surface:rgba(255,255,255,0.03); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
}
[data-theme="blue"]{ --acc:#2f86e6; --acc2:#5aa2f0; --acc-rgb:47,134,230; --text:#cdd8e8; --dim:#8695ab; --faint:#5f6f88; --line:rgba(140,180,255,0.12); --line2:rgba(140,180,255,0.2); --bg:#070d1a; }
[data-theme="red"]{ --acc:#dc1414; --acc2:#ff5a5a; --acc-rgb:220,20,20; --text:#d4cdcd; --dim:#9a8f8f; --faint:#6a5f5f; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.15); --bg:#060608; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:6px 14px 10px;overflow:hidden;}
.wrap{width:100%;max-width:540px;}
.head{display:flex;flex-direction:column;gap:3px;margin-bottom:14px;}
.eyebrow{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;}
.title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,5.4vw,26px);color:#f2f5f4;letter-spacing:.3px;line-height:1.1;}
.lead{font-size:12.5px;color:var(--dim);line-height:1.5;max-width:470px;}
.tabs{display:flex;gap:7px;margin:14px 0 16px;flex-wrap:wrap;}
.tab{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--dim);font:600 12px 'Inter',sans-serif;display:flex;align-items:center;gap:8px;transition:all .18s;text-align:left;}
.tab:hover{border-color:var(--line2);color:var(--text);}
.tab .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace;color:var(--dim);flex-shrink:0;}
.tab.active{border-color:rgba(var(--acc-rgb),0.5);background:rgba(var(--acc-rgb),0.08);color:#f2f5f4;}
.tab.active .n{border-color:var(--acc);color:var(--acc);}
.stage{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;}
svg{width:100%;overflow:visible;display:block;}
.qbox{margin-top:14px;background:rgba(0,0,0,0.28);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;color:var(--text);overflow-x:auto;}
.qbox .kw{color:var(--dim);}
.qbox .val{color:var(--acc2);}
.explain{margin-top:12px;font-size:13px;line-height:1.65;color:var(--text);}
.explain .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);}
.prevent{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--dim);display:none;}
.prevent.show{display:block;}
.prevent b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">Web &middot; Encryption</div>
    <div class="title">TLS Handshake</div>
    <div class="lead">How your browser and a server agree on a shared key and open the encrypted tunnel behind the padlock.</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="setPhase(0)"><span class="n">1</span>Hello</button>
    <button class="tab" id="tab1" onclick="setPhase(1)"><span class="n">2</span>Verify &amp; key</button>
    <button class="tab" id="tab2" onclick="setPhase(2)"><span class="n">3</span>Encrypted tunnel</button>
  </div>

  <div class="stage">
    <svg viewBox="0 0 520 150">
      <!-- Browser -->
      <g>
        <rect x="8" y="34" width="108" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="36" y="48" width="52" height="34" rx="4" fill="rgba(255,255,255,0.04)" stroke="var(--line)" stroke-width="1"/>
        <rect x="36" y="48" width="52" height="9" rx="4" fill="rgba(var(--acc-rgb),0.15)"/>
        <circle cx="42" cy="52.5" r="1.6" fill="var(--acc)"/><circle cx="48" cy="52.5" r="1.6" fill="var(--dim)"/><circle cx="54" cy="52.5" r="1.6" fill="var(--dim)"/>
        <rect x="42" y="63" width="40" height="3" rx="1.5" fill="var(--dim)"/><rect x="42" y="70" width="28" height="3" rx="1.5" fill="var(--dim)" opacity=".7"/>
        <text x="62" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Browser</text>
      </g>
      <!-- Server -->
      <g>
        <rect x="404" y="34" width="108" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="424" y="46" width="68" height="15" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="432" cy="53.5" r="2.4" fill="var(--acc)"/><rect x="440" y="52" width="42" height="3" rx="1.5" fill="var(--dim)"/>
        <rect x="424" y="65" width="68" height="15" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="432" cy="72.5" r="2.4" fill="var(--dim)"/><rect x="440" y="71" width="42" height="3" rx="1.5" fill="var(--dim)" opacity=".6"/>
        <text x="458" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Server</text>
      </g>
      <!-- Messages, redrawn per phase -->
      <g id="flows"></g>
    </svg>

    <div class="qbox" id="qbox"></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="prevent" id="prevent"><b>Why it matters:</b> a correct TLS handshake is the padlock in your address bar. It is what stops a man in the middle from reading or changing your traffic.</div>
</div>

<script>
function arrow(xa, xb, label, pos){
  var y = pos==='top' ? 58 : 86;
  var x1 = Math.min(xa,xb)+2, x2 = Math.max(xa,xb)-2, dir = xb>xa?1:-1;
  var sx = dir>0 ? x1 : x2, ex = dir>0 ? x2 : x1;
  var g = '<line x1="'+sx+'" y1="'+y+'" x2="'+ex+'" y2="'+y+'" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" marker-end="url(#mOk)"/>';
  var mx=(x1+x2)/2, ly = pos==='top' ? 48 : 101, w=label.length*5.5+12;
  g += '<rect x="'+(mx-w/2)+'" y="'+(ly-10)+'" width="'+w+'" height="14" rx="4" fill="rgba(10,12,12,0.55)"/>'+
       '<text x="'+mx+'" y="'+ly+'" text-anchor="middle" font="600 9.5px Inter" fill="var(--acc2)">'+label+'</text>';
  return g;
}
// Padlock between the two nodes, shown once the tunnel is open.
function lock(){
  return '<g transform="translate(252,55)">'+
    '<path d="M4 9 V6 a6 6 0 0 1 12 0 v3" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/>'+
    '<rect x="0" y="9" width="20" height="15" rx="3" fill="rgba(var(--acc-rgb),0.14)" stroke="var(--acc)" stroke-width="1.8"/>'+
    '<circle cx="10" cy="16" r="2" fill="var(--acc)"/><rect x="9" y="16" width="2" height="4" rx="1" fill="var(--acc)"/>'+
    '</g>';
}

var defs='<defs>'+
 '<marker id="mOk" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--acc)"/></marker>'+
 '</defs>';

var PHASES=[
  { flows:[ arrow(116,404,'ClientHello','top'), arrow(404,116,'ServerHello','bot') ], lock:false,
    query:'<span class="kw">ClientHello</span>  &rarr;  TLS 1.3 &middot; cipher list &middot; random<br><span class="kw">ServerHello</span>  &larr;  <span class="val">cipher chosen</span> &middot; random',
    explain:'Your browser says hello and lists the TLS versions and ciphers it supports. The server replies with the version and cipher it picked. No secrets are sent yet.' },
  { flows:[ arrow(404,116,'Certificate','top'), arrow(116,404,'key share','bot') ], lock:false,
    query:'<span class="kw">Certificate</span>  &larr;  CN=bank.com, signed by a trusted CA  <span class="val">[verified]</span><br><span class="kw">Key share</span>  &rarr;  <span class="val">shared session key agreed</span>',
    explain:'The server sends its certificate, signed by a trusted authority, which proves it really is bank.com. Your browser checks it, then both sides agree on a shared secret key.' },
  { flows:[ arrow(116,404,'encrypted data','top'), arrow(404,116,'encrypted data','bot') ], lock:true,
    query:'<span class="kw">GET</span> /account  &rarr;  <span class="val">a3f90b2e c641&hellip;7d  (encrypted)</span>',
    explain:'From here every message is encrypted with that shared key. Anyone watching the network sees only scrambled bytes, and nobody can quietly change the data.' },
];

var timer=null;
function setPhase(i){
  var p=PHASES[i];
  for(var j=0;j<3;j++){ document.getElementById('tab'+j).classList.toggle('active', j===i); }
  document.getElementById('flows').innerHTML=defs+(p.lock?lock():'')+p.flows.join('');
  document.getElementById('qbox').innerHTML=p.query;
  document.getElementById('explain').innerHTML=p.explain;
  document.getElementById('prevent').classList.toggle('show', i===2);
  if(timer) clearTimeout(timer);
  timer=setTimeout(function(){ setPhase((i+1)%3); }, i===2?7000:5500);
  sendHeight();
}

function applyTheme(t){ if(t==='blue'||t==='red'||t==='green'){ document.documentElement.setAttribute('data-theme', t==='green'?'':t); } }
(function(){ try{ var m=location.search.match(/theme=(green|blue|red)/); if(m) applyTheme(m[1]); }catch(e){} })();
window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='acx-theme') applyTheme(d.theme); });

function sendHeight(){ try{ var h=Math.ceil(document.body.scrollHeight)+16; window.parent.postMessage({type:'acx-diagram-height', height:h}, '*'); }catch(e){} }
window.addEventListener('load', function(){ sendHeight(); try{ window.parent.postMessage({type:'acx-diagram-ready'}, '*'); }catch(e){} });
window.addEventListener('resize', sendHeight);
if(window.ResizeObserver){ new ResizeObserver(sendHeight).observe(document.body); }
setPhase(0);
setTimeout(sendHeight,300); setTimeout(sendHeight,1000);
</script>
</body>
</html>
