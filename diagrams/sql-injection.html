<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SQL Injection @alex.cyberx</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* Theme-aware (green / blue / red): the accent follows the site theme, set from
   ?theme= and a postMessage from the page. No danger colour: the attacker path
   is grey and dashed, told apart by lightness and style, not by hue. */
:root{
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --bg:#0b0d0d;
  --text:#d7dcda; --dim:#8b938f; --faint:#5c6460;
  --surface:rgba(255,255,255,0.03); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --bad:#9aa29d; --bad-rgb:154,162,157;
}
[data-theme="blue"]{ --acc:#2f86e6; --acc2:#5aa2f0; --acc-rgb:47,134,230; --text:#cdd8e8; --dim:#8695ab; --faint:#5f6f88; --line:rgba(140,180,255,0.12); --line2:rgba(140,180,255,0.2); --bg:#070d1a; }
[data-theme="red"]{ --acc:#dc1414; --acc2:#ff5a5a; --acc-rgb:220,20,20; --text:#d4cdcd; --dim:#9a8f8f; --faint:#6a5f5f; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.15); --bg:#060608; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:6px 14px 10px;overflow:hidden;}
.wrap{width:100%;max-width:540px;}

.head{display:flex;flex-direction:column;gap:3px;margin-bottom:14px;}
.eyebrow{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;}
.title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,5.4vw,26px);color:#f2f5f4;letter-spacing:.3px;line-height:1.1;}
.lead{font-size:12.5px;color:var(--dim);line-height:1.5;max-width:470px;}

.tabs{display:flex;gap:7px;margin:14px 0 16px;flex-wrap:wrap;}
.tab{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--dim);font:600 12px 'Inter',sans-serif;display:flex;align-items:center;gap:8px;transition:all .18s;text-align:left;}
.tab:hover{border-color:var(--line2);color:var(--text);}
.tab .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace;color:var(--dim);flex-shrink:0;}
.tab.active{border-color:rgba(var(--acc-rgb),0.5);background:rgba(var(--acc-rgb),0.08);color:#f2f5f4;}
.tab.active .n{border-color:var(--acc);color:var(--acc);}

.stage{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;}
svg{width:100%;overflow:visible;display:block;}

/* SQL query box: the heart of the lesson, what the app actually runs. */
.qbox{margin-top:14px;background:rgba(0,0,0,0.28);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--text);overflow-x:auto;}
.qbox .kw{color:var(--dim);}
.qbox .val{color:var(--acc2);}
.qbox .inj{color:#f2f5f4;background:rgba(var(--bad-rgb),0.16);border-bottom:1.5px dashed var(--bad);border-radius:2px;padding:0 2px;}

.explain{margin-top:12px;font-size:13px;line-height:1.65;color:var(--text);}
.explain .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);}
.explain.bad .mono{color:#f2f5f4;background:rgba(var(--bad-rgb),0.16);border-radius:3px;padding:0 4px;}
.prevent{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--dim);display:none;}
.prevent.show{display:block;}
.prevent b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">Web &middot; Injection</div>
    <div class="title">SQL Injection</div>
    <div class="lead">How unchecked input in a login form turns into database code, and lets an attacker walk past the password.</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="setPhase(0)"><span class="n">1</span>Normal login</button>
    <button class="tab" id="tab1" onclick="setPhase(1)"><span class="n">2</span>Injected input</button>
    <button class="tab" id="tab2" onclick="setPhase(2)"><span class="n">3</span>Auth bypassed</button>
  </div>

  <div class="stage">
    <svg viewBox="0 0 520 140">
      <!-- You / attacker -->
      <g>
        <rect x="8" y="30" width="96" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="34" y="46" width="44" height="30" rx="4" fill="rgba(255,255,255,0.04)" stroke="var(--line)" stroke-width="1"/>
        <rect x="39" y="51" width="22" height="3" rx="1.5" fill="var(--acc)" opacity=".85"/>
        <rect x="39" y="57" width="32" height="3" rx="1.5" fill="var(--dim)"/>
        <rect x="39" y="63" width="18" height="3" rx="1.5" fill="var(--dim)" opacity=".7"/>
        <rect x="50" y="76" width="12" height="4" rx="1" fill="var(--line2)"/>
        <text x="56" y="118" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">You / Attacker</text>
      </g>
      <!-- Web app -->
      <g>
        <rect x="212" y="30" width="96" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="224" y="42" width="72" height="12" rx="3" fill="rgba(255,255,255,0.03)"/>
        <circle cx="232" cy="48" r="2.3" fill="var(--dim)"/><circle cx="240" cy="48" r="2.3" fill="var(--dim)" opacity=".6"/><circle cx="248" cy="48" r="2.3" fill="var(--dim)" opacity=".4"/>
        <rect x="224" y="60" width="72" height="5" rx="2.5" fill="rgba(var(--acc-rgb),0.25)"/>
        <rect x="224" y="69" width="54" height="5" rx="2.5" fill="rgba(255,255,255,0.06)"/>
        <rect x="224" y="78" width="62" height="5" rx="2.5" fill="rgba(255,255,255,0.06)"/>
        <text x="260" y="118" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Web app</text>
      </g>
      <!-- Database -->
      <g>
        <rect x="416" y="30" width="96" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <ellipse cx="464" cy="50" rx="26" ry="6.5" fill="rgba(var(--acc-rgb),0.12)" stroke="var(--acc)" stroke-width="1"/>
        <path d="M438 50 v26 a26 6.5 0 0 0 52 0 v-26" fill="none" stroke="var(--acc)" stroke-width="1" opacity=".55"/>
        <line x1="438" y1="63" x2="490" y2="63" stroke="var(--acc)" stroke-width="1" opacity=".3"/>
        <text x="464" y="118" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Database</text>
      </g>
      <!-- Flow arrows (redrawn per phase) -->
      <g id="flows"></g>
    </svg>

    <div class="qbox" id="qbox"></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="prevent" id="prevent"><b>Prevent it:</b> use prepared statements, parameterized queries, input validation, and a least-privilege database user.</div>
</div>

<script>
// One horizontal arrow with its label in a chip, kept clear of the line so
// nothing overlaps. pos 'top'/'bot'. Arrow points from xa to xb.
function arrow(xa, xb, bad, label, pos){
  var y = pos==='top' ? 56 : 84;
  var x1 = Math.min(xa,xb)+2, x2 = Math.max(xa,xb)-2, dir = xb>xa?1:-1;
  var col = bad ? 'var(--bad)' : 'var(--acc)';
  var sx = dir>0 ? x1 : x2, ex = dir>0 ? x2 : x1;
  var dash = bad ? ' stroke-dasharray="6 5"' : '';
  var g = '<line x1="'+sx+'" y1="'+y+'" x2="'+ex+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"'+dash+' stroke-linecap="round" marker-end="url(#'+(bad?'mBad':'mOk')+')"/>';
  var mx=(x1+x2)/2, ly = pos==='top' ? 46 : 99, w=label.length*5.5+12;
  g += '<rect x="'+(mx-w/2)+'" y="'+(ly-10)+'" width="'+w+'" height="14" rx="4" fill="rgba(10,12,12,0.55)"/>'+
       '<text x="'+mx+'" y="'+ly+'" text-anchor="middle" font="600 9.5px Inter" fill="'+(bad?'var(--text)':'var(--acc2)')+'">'+label+'</text>';
  return g;
}

var defs='<defs>'+
 '<marker id="mOk" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--acc)"/></marker>'+
 '<marker id="mBad" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--bad)"/></marker>'+
 '</defs>';

// edges: You 8..104, App 212..308, DB 416..512. gaps: 104-212, 308-416.
var PHASES=[
  { flows:[ arrow(104,212,false,'login form','top'), arrow(308,416,false,'safe query','top'),
            arrow(416,308,false,'1 row','bot'), arrow(212,104,false,'welcome','bot') ],
    query:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> users <span class="kw">WHERE</span> name = <span class="val">\'rahul\'</span> <span class="kw">AND</span> pass = <span class="val">\'&bull;&bull;&bull;&bull;\'</span>',
    explain:'The username and password go in as data, through <span class="mono">?</span> placeholders, so what you type can never become part of the query. The database finds one matching row and login succeeds.',
    bad:false },
  { flows:[ arrow(104,212,true,"' OR '1'='1",'top'), arrow(308,416,true,'now code','top') ],
    query:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> users <span class="kw">WHERE</span> name = <span class="val">\'rahul\'</span> <span class="kw">AND</span> pass = <span class="inj">\'\' OR \'1\'=\'1\'</span>',
    explain:'Instead of a password the attacker types <span class="mono">\' OR \'1\'=\'1</span>. The app glues the input into the query as text, so it becomes code, and <span class="mono">\'1\'=\'1\'</span> is true for every row.',
    bad:true },
  { flows:[ arrow(308,416,true,'always true','top'), arrow(416,308,true,'a row','bot'), arrow(212,104,true,'logged in','bot') ],
    query:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> users <span class="kw">WHERE</span> name = <span class="val">\'rahul\'</span> <span class="kw">AND</span> pass = <span class="inj">\'\' OR \'1\'=\'1\'</span>  <span style="color:var(--dim)">&rarr; matches everyone</span>',
    explain:'A row comes back with no real password, so the app logs the attacker in, often as the first user (an admin). The same trick can read, change or delete other data.',
    bad:true },
];

var timer=null;
function setPhase(i){
  var p=PHASES[i];
  for(var j=0;j<3;j++){ document.getElementById('tab'+j).classList.toggle('active', j===i); }
  document.getElementById('flows').innerHTML=defs+p.flows.join('');
  document.getElementById('qbox').innerHTML=p.query;
  var ex=document.getElementById('explain'); ex.innerHTML=p.explain; ex.className='explain'+(p.bad?' bad':'');
  document.getElementById('prevent').classList.toggle('show', i===2);
  if(timer) clearTimeout(timer);
  timer=setTimeout(function(){ setPhase((i+1)%3); }, i===2?7000:5500);
  sendHeight();
}

// Theme: from ?theme= and from the page (postMessage). Default green.
function applyTheme(t){ if(t==='blue'||t==='red'||t==='green'){ document.documentElement.setAttribute('data-theme', t==='green'?'':t); } }
(function(){ try{ var m=location.search.match(/theme=(green|blue|red)/); if(m) applyTheme(m[1]); }catch(e){} })();
window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='acx-theme') applyTheme(d.theme); });

function sendHeight(){ try{ var h=Math.ceil(document.body.scrollHeight)+16; window.parent.postMessage({type:'acx-diagram-height', height:h}, '*'); }catch(e){} }
window.addEventListener('load', function(){ sendHeight(); try{ window.parent.postMessage({type:'acx-diagram-ready'}, '*'); }catch(e){} });
window.addEventListener('resize', sendHeight);
if(window.ResizeObserver){ new ResizeObserver(sendHeight).observe(document.body); }
setPhase(0);
setTimeout(sendHeight,300); setTimeout(sendHeight,1000);
</script>
</body>
</html>
