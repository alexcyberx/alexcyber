<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Man in the Middle @alex.cyberx</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* Theme-aware (green / blue / red): accent follows the site theme via ?theme=
   and a parent postMessage. No danger colour: the attacker path is grey and
   dashed, told apart by lightness and style, not hue. */
:root{
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --bg:#0b0d0d;
  --text:#d7dcda; --dim:#8b938f; --faint:#5c6460;
  --surface:rgba(255,255,255,0.03); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --bad:#9aa29d; --bad-rgb:154,162,157;
}
[data-theme="blue"]{ --acc:#2f86e6; --acc2:#5aa2f0; --acc-rgb:47,134,230; --text:#cdd8e8; --dim:#8695ab; --faint:#5f6f88; --line:rgba(140,180,255,0.12); --line2:rgba(140,180,255,0.2); --bg:#070d1a; }
[data-theme="red"]{ --acc:#dc1414; --acc2:#ff5a5a; --acc-rgb:220,20,20; --text:#d4cdcd; --dim:#9a8f8f; --faint:#6a5f5f; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.15); --bg:#060608; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:6px 14px 10px;overflow:hidden;}
.wrap{width:100%;max-width:540px;}
.head{display:flex;flex-direction:column;gap:3px;margin-bottom:14px;}
.eyebrow{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;}
.title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,5.4vw,26px);color:#f2f5f4;letter-spacing:.3px;line-height:1.1;}
.lead{font-size:12.5px;color:var(--dim);line-height:1.5;max-width:470px;}
.tabs{display:flex;gap:7px;margin:14px 0 16px;flex-wrap:wrap;}
.tab{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--dim);font:600 12px 'Inter',sans-serif;display:flex;align-items:center;gap:8px;transition:all .18s;text-align:left;}
.tab:hover{border-color:var(--line2);color:var(--text);}
.tab .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace;color:var(--dim);flex-shrink:0;}
.tab.active{border-color:rgba(var(--acc-rgb),0.5);background:rgba(var(--acc-rgb),0.08);color:#f2f5f4;}
.tab.active .n{border-color:var(--acc);color:var(--acc);}
.stage{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;}
svg{width:100%;overflow:visible;display:block;}
.qbox{margin-top:14px;background:rgba(0,0,0,0.28);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--text);overflow-x:auto;}
.qbox .kw{color:var(--dim);}
.qbox .val{color:var(--acc2);}
.qbox .inj{color:#f2f5f4;background:rgba(var(--bad-rgb),0.16);border-bottom:1.5px dashed var(--bad);border-radius:2px;padding:0 2px;}
.explain{margin-top:12px;font-size:13px;line-height:1.65;color:var(--text);}
.explain .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);}
.explain.bad .mono{color:#f2f5f4;background:rgba(var(--bad-rgb),0.16);border-radius:3px;padding:0 4px;}
.prevent{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--dim);display:none;}
.prevent.show{display:block;}
.prevent b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">Network &middot; Interception</div>
    <div class="title">Man in the Middle</div>
    <div class="lead">How someone on the same network can sit between you and a server, and why HTTPS stops them reading your login.</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="setPhase(0)"><span class="n">1</span>Direct path</button>
    <button class="tab" id="tab1" onclick="setPhase(1)"><span class="n">2</span>In the middle</button>
    <button class="tab" id="tab2" onclick="setPhase(2)"><span class="n">3</span>Read or safe</button>
  </div>

  <div class="stage">
    <svg viewBox="0 0 520 150">
      <!-- You -->
      <g>
        <rect x="8" y="34" width="96" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="34" y="50" width="44" height="30" rx="4" fill="rgba(255,255,255,0.04)" stroke="var(--line)" stroke-width="1"/>
        <rect x="39" y="55" width="22" height="3" rx="1.5" fill="var(--acc)" opacity=".85"/>
        <rect x="39" y="61" width="32" height="3" rx="1.5" fill="var(--dim)"/>
        <rect x="39" y="67" width="18" height="3" rx="1.5" fill="var(--dim)" opacity=".7"/>
        <rect x="50" y="80" width="12" height="4" rx="1" fill="var(--line2)"/>
        <text x="56" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">You</text>
      </g>
      <!-- Server -->
      <g>
        <rect x="416" y="34" width="96" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="430" y="46" width="68" height="15" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="438" cy="53.5" r="2.4" fill="var(--acc)"/><rect x="446" y="52" width="40" height="3" rx="1.5" fill="var(--dim)"/>
        <rect x="430" y="65" width="68" height="15" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="438" cy="72.5" r="2.4" fill="var(--dim)"/><rect x="446" y="71" width="40" height="3" rx="1.5" fill="var(--dim)" opacity=".6"/>
        <text x="464" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Server</text>
      </g>
      <!-- Attacker (middle) + arrows, redrawn per phase -->
      <g id="flows"></g>
    </svg>

    <div class="qbox" id="qbox"></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="prevent" id="prevent"><b>Prevent it:</b> use HTTPS everywhere and check the padlock, enable HSTS, and avoid logging in on untrusted Wi-Fi, or use a VPN.</div>
</div>

<script>
function arrow(xa, xb, bad, label, pos){
  var y = pos==='top' ? 60 : 88;
  var x1 = Math.min(xa,xb)+2, x2 = Math.max(xa,xb)-2, dir = xb>xa?1:-1;
  var col = bad ? 'var(--bad)' : 'var(--acc)';
  var sx = dir>0 ? x1 : x2, ex = dir>0 ? x2 : x1;
  var dash = bad ? ' stroke-dasharray="6 5"' : '';
  var g = '<line x1="'+sx+'" y1="'+y+'" x2="'+ex+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"'+dash+' stroke-linecap="round" marker-end="url(#'+(bad?'mBad':'mOk')+')"/>';
  var mx=(x1+x2)/2, ly = pos==='top' ? 50 : 103, w=label.length*5.5+12;
  g += '<rect x="'+(mx-w/2)+'" y="'+(ly-10)+'" width="'+w+'" height="14" rx="4" fill="rgba(10,12,12,0.55)"/>'+
       '<text x="'+mx+'" y="'+ly+'" text-anchor="middle" font="600 9.5px Inter" fill="'+(bad?'var(--text)':'var(--acc2)')+'">'+label+'</text>';
  return g;
}
// Attacker node in the middle (x 212..308), grey to read as the intruder.
function attacker(){
  return '<g>'+
    '<rect x="212" y="34" width="96" height="70" rx="11" fill="rgba('+'var(--bad-rgb)'+',0.05)" stroke="var(--bad)" stroke-width="1.4" stroke-dasharray="5 4"/>'+
    '<circle cx="260" cy="58" r="11" fill="none" stroke="var(--bad)" stroke-width="1.6"/>'+
    '<circle cx="256" cy="57" r="1.7" fill="var(--bad)"/><circle cx="264" cy="57" r="1.7" fill="var(--bad)"/>'+
    '<path d="M250 50 q10 -7 20 0" stroke="var(--bad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>'+
    '<path d="M246 86 q14 -12 28 0" stroke="var(--bad)" stroke-width="1.6" fill="none" stroke-linecap="round"/>'+
    '<text x="260" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Attacker</text>'+
    '</g>';
}

var defs='<defs>'+
 '<marker id="mOk" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--acc)"/></marker>'+
 '<marker id="mBad" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--bad)"/></marker>'+
 '</defs>';

var PHASES=[
  { mid:false,
    flows:[ arrow(104,416,false,'login request','top'), arrow(416,104,false,'response','bot') ],
    query:'<span class="kw">POST</span> /login   user=<span class="val">rahul</span>   pass=<span class="val">Gharkart@123</span>',
    explain:'Your login request leaves your device, crosses the Wi-Fi and the network, and reaches the server. Normally only you and the server handle it.',
    bad:false },
  { mid:true,
    flows:[ arrow(104,212,true,'your traffic','top'), arrow(308,416,true,'relayed','top'),
            arrow(416,308,true,'reply','bot'), arrow(212,104,true,'passed back','bot') ],
    query:'<span class="kw">POST</span> /login   user=<span class="val">rahul</span>   pass=<span class="inj">Gharkart@123</span>',
    explain:'On open Wi-Fi, or by ARP spoofing the local network, the attacker makes your device send everything to them first. Every packet now passes through the attacker before the server.',
    bad:true },
  { mid:true,
    flows:[ arrow(104,212,true,'password','top'), arrow(308,416,true,'forwarded','top'),
            arrow(212,104,true,'looks normal','bot') ],
    query:'<span class="kw">over HTTP </span> pass = <span class="inj">Gharkart@123</span><br><span class="kw">over HTTPS</span> <span class="val">3f90b2a1c6&hellip;7d</span>  <span class="kw">(encrypted, unreadable)</span>',
    explain:'Over plain HTTP the attacker reads your password in clear text and can reuse it. Over HTTPS the same packet is encrypted, so they see only scrambled bytes and learn nothing.',
    bad:true },
];

var timer=null;
function setPhase(i){
  var p=PHASES[i];
  for(var j=0;j<3;j++){ document.getElementById('tab'+j).classList.toggle('active', j===i); }
  document.getElementById('flows').innerHTML=defs+(p.mid?attacker():'')+p.flows.join('');
  document.getElementById('qbox').innerHTML=p.query;
  var ex=document.getElementById('explain'); ex.innerHTML=p.explain; ex.className='explain'+(p.bad?' bad':'');
  document.getElementById('prevent').classList.toggle('show', i===2);
  if(timer) clearTimeout(timer);
  timer=setTimeout(function(){ setPhase((i+1)%3); }, i===2?7000:5500);
  sendHeight();
}

function applyTheme(t){ if(t==='blue'||t==='red'||t==='green'){ document.documentElement.setAttribute('data-theme', t==='green'?'':t); } }
(function(){ try{ var m=location.search.match(/theme=(green|blue|red)/); if(m) applyTheme(m[1]); }catch(e){} })();
window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='acx-theme') applyTheme(d.theme); });

function sendHeight(){ try{ var h=Math.ceil(document.body.scrollHeight)+16; window.parent.postMessage({type:'acx-diagram-height', height:h}, '*'); }catch(e){} }
window.addEventListener('load', function(){ sendHeight(); try{ window.parent.postMessage({type:'acx-diagram-ready'}, '*'); }catch(e){} });
window.addEventListener('resize', sendHeight);
if(window.ResizeObserver){ new ResizeObserver(sendHeight).observe(document.body); }
setPhase(0);
setTimeout(sendHeight,300); setTimeout(sendHeight,1000);
</script>
</body>
</html>
