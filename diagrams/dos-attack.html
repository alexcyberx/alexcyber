<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DoS Attack @alex.cyberx</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* Theme-aware (green / blue / red): accent follows the site theme via ?theme=
   and a parent postMessage. No danger colour: the flood is grey and dashed,
   told apart by lightness and style, not hue. */
:root{
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --bg:#0b0d0d;
  --text:#d7dcda; --dim:#8b938f; --faint:#5c6460;
  --surface:rgba(255,255,255,0.03); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --bad:#9aa29d; --bad-rgb:154,162,157;
}
[data-theme="blue"]{ --acc:#2f86e6; --acc2:#5aa2f0; --acc-rgb:47,134,230; --text:#cdd8e8; --dim:#8695ab; --faint:#5f6f88; --line:rgba(140,180,255,0.12); --line2:rgba(140,180,255,0.2); --bg:#070d1a; }
[data-theme="red"]{ --acc:#dc1414; --acc2:#ff5a5a; --acc-rgb:220,20,20; --text:#d4cdcd; --dim:#9a8f8f; --faint:#6a5f5f; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.15); --bg:#060608; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:6px 14px 10px;overflow:hidden;}
.wrap{width:100%;max-width:540px;}
.head{display:flex;flex-direction:column;gap:3px;margin-bottom:14px;}
.eyebrow{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;}
.title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,5.4vw,26px);color:#f2f5f4;letter-spacing:.3px;line-height:1.1;}
.lead{font-size:12.5px;color:var(--dim);line-height:1.5;max-width:470px;}
.tabs{display:flex;gap:7px;margin:14px 0 16px;flex-wrap:wrap;}
.tab{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--dim);font:600 12px 'Inter',sans-serif;display:flex;align-items:center;gap:8px;transition:all .18s;text-align:left;}
.tab:hover{border-color:var(--line2);color:var(--text);}
.tab .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace;color:var(--dim);flex-shrink:0;}
.tab.active{border-color:rgba(var(--acc-rgb),0.5);background:rgba(var(--acc-rgb),0.08);color:#f2f5f4;}
.tab.active .n{border-color:var(--acc);color:var(--acc);}
.stage{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;}
svg{width:100%;overflow:visible;display:block;}
.meter{margin-top:16px;height:16px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--line);display:flex;overflow:hidden;}
.mfill{height:100%;transition:width .4s ease;}
.mfill.legit{background:var(--acc);}
.mfill.flood{background:repeating-linear-gradient(45deg,rgba(var(--bad-rgb),0.9),rgba(var(--bad-rgb),0.9) 5px,rgba(var(--bad-rgb),0.55) 5px,rgba(var(--bad-rgb),0.55) 10px);}
.mlabel{margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;}
.mlabel b{color:#f2f5f4;font-weight:700;}
.explain{margin-top:12px;font-size:13px;line-height:1.65;color:var(--text);}
.explain .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);}
.explain.bad .mono{color:#f2f5f4;background:rgba(var(--bad-rgb),0.16);border-radius:3px;padding:0 4px;}
.prevent{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--dim);display:none;}
.prevent.show{display:block;}
.prevent b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">Availability &middot; Flooding</div>
    <div class="title">Denial of Service</div>
    <div class="lead">How a flood of fake traffic fills a server&rsquo;s capacity so real users cannot get through.</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="setPhase(0)"><span class="n">1</span>Normal traffic</button>
    <button class="tab" id="tab1" onclick="setPhase(1)"><span class="n">2</span>Flood</button>
    <button class="tab" id="tab2" onclick="setPhase(2)"><span class="n">3</span>Service down</button>
  </div>

  <div class="stage">
    <svg viewBox="0 0 520 150">
      <!-- Real users -->
      <g>
        <rect x="8" y="34" width="100" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <circle cx="42" cy="60" r="7" fill="none" stroke="var(--acc)" stroke-width="1.5"/><path d="M31 80 q11 -11 22 0" stroke="var(--acc)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="68" cy="66" r="5.5" fill="none" stroke="var(--dim)" stroke-width="1.3"/><path d="M60 82 q8 -8 16 0" stroke="var(--dim)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <text x="58" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Real users</text>
      </g>
      <!-- Server -->
      <g>
        <rect x="380" y="34" width="100" height="70" rx="11" fill="rgba(255,255,255,0.02)" stroke="var(--line)" stroke-width="1.4"/>
        <rect x="402" y="46" width="56" height="14" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="410" cy="53" r="2.2" fill="var(--acc)"/><rect x="417" y="51.5" width="32" height="3" rx="1.5" fill="var(--dim)"/>
        <rect x="402" y="64" width="56" height="14" rx="3" fill="rgba(255,255,255,0.03)" stroke="var(--line)" stroke-width=".8"/>
        <circle cx="410" cy="71" r="2.2" fill="var(--dim)"/><rect x="417" y="69.5" width="32" height="3" rx="1.5" fill="var(--dim)" opacity=".6"/>
        <text x="430" y="122" text-anchor="middle" font="700 11px Rajdhani" fill="#f2f5f4">Server</text>
      </g>
      <!-- Botnet + arrows, redrawn per phase -->
      <g id="flows"></g>
    </svg>

    <div class="meter"><div class="mfill legit" id="mLegit" style="width:22%"></div><div class="mfill flood" id="mFlood" style="width:0%"></div></div>
    <div class="mlabel"><span id="mState">Server load: <b>light</b></span><span id="mPct">22%</span></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="prevent" id="prevent"><b>Prevent it:</b> rate limiting, a WAF or CDN (Cloudflare, Akamai), autoscaling, SYN cookies, and filtering or blackholing bad traffic upstream.</div>
</div>

<script>
function arrow(xa, xb, bad, label, pos, y){
  y = y || (pos==='top' ? 58 : 86);
  var x1 = Math.min(xa,xb)+2, x2 = Math.max(xa,xb)-2, dir = xb>xa?1:-1;
  var col = bad ? 'var(--bad)' : 'var(--acc)';
  var sx = dir>0 ? x1 : x2, ex = dir>0 ? x2 : x1;
  var dash = bad ? ' stroke-dasharray="6 5"' : '';
  var g = '<line x1="'+sx+'" y1="'+y+'" x2="'+ex+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"'+dash+' stroke-linecap="round" marker-end="url(#'+(bad?'mBad':'mOk')+')"/>';
  if(label){ var mx=(x1+x2)/2, ly=(pos==='top'?y-10:y+15), w=label.length*5.5+12;
    g += '<rect x="'+(mx-w/2)+'" y="'+(ly-10)+'" width="'+w+'" height="14" rx="4" fill="rgba(10,12,12,0.55)"/>'+
         '<text x="'+mx+'" y="'+ly+'" text-anchor="middle" font="600 9.5px Inter" fill="'+(bad?'var(--text)':'var(--acc2)')+'">'+label+'</text>'; }
  return g;
}
// Botnet: a cluster of small grey machines firing at the server.
function botnet(){
  var bots=[[150,30],[188,26],[150,56],[206,44],[246,30],[274,50],[228,62]];
  var g='<text x="206" y="18" text-anchor="middle" font="700 9px Rajdhani" fill="#f2f5f4">Botnet (thousands of machines)</text>';
  bots.forEach(function(b){
    g+='<rect x="'+b[0]+'" y="'+b[1]+'" width="13" height="11" rx="2" fill="rgba('+'var(--bad-rgb)'+',0.12)" stroke="var(--bad)" stroke-width="1"/>';
    g+='<line x1="'+(b[0]+14)+'" y1="'+(b[1]+5.5)+'" x2="372" y2="56" stroke="var(--bad)" stroke-width="1.4" stroke-dasharray="5 4" opacity=".7" marker-end="url(#mBad)"/>';
  });
  return g;
}

var defs='<defs>'+
 '<marker id="mOk" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--acc)"/></marker>'+
 '<marker id="mBad" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 Z" fill="var(--bad)"/></marker>'+
 '</defs>';

var PHASES=[
  { bot:false,
    flows:[ arrow(108,380,false,'requests','top'), arrow(380,108,false,'responses','bot') ],
    legit:22, flood:0, state:'Server load: <b>light</b>', pct:'22%',
    explain:'A normal number of users send requests, and the server has plenty of capacity to answer every one.',
    bad:false },
  { bot:true,
    flows:[ arrow(108,380,false,'you','bot') ],
    legit:18, flood:80, state:'Server load: <b>full</b>', pct:'98%',
    explain:'The attacker commands a botnet of thousands of machines to send a flood of requests at once. The server&rsquo;s capacity fills up with junk traffic.',
    bad:true },
  { bot:true,
    flows:[ arrow(108,300,true,'timeout','bot') ],
    legit:8, flood:92, state:'Server <b>overloaded</b>', pct:'100%',
    explain:'With capacity full, the server cannot answer real users. Their requests time out, so the service is down for everyone. That is the denial of service.',
    bad:true },
];

var timer=null;
function setPhase(i){
  var p=PHASES[i];
  for(var j=0;j<3;j++){ document.getElementById('tab'+j).classList.toggle('active', j===i); }
  document.getElementById('flows').innerHTML=defs+(p.bot?botnet():'')+p.flows.join('');
  document.getElementById('mLegit').style.width=p.legit+'%';
  document.getElementById('mFlood').style.width=p.flood+'%';
  document.getElementById('mState').innerHTML=p.state;
  document.getElementById('mPct').textContent=p.pct;
  var ex=document.getElementById('explain'); ex.innerHTML=p.explain; ex.className='explain'+(p.bad?' bad':'');
  document.getElementById('prevent').classList.toggle('show', i===2);
  if(timer) clearTimeout(timer);
  timer=setTimeout(function(){ setPhase((i+1)%3); }, i===2?7000:5500);
  sendHeight();
}

function applyTheme(t){ if(t==='blue'||t==='red'||t==='green'){ document.documentElement.setAttribute('data-theme', t==='green'?'':t); } }
(function(){ try{ var m=location.search.match(/theme=(green|blue|red)/); if(m) applyTheme(m[1]); }catch(e){} })();
window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='acx-theme') applyTheme(d.theme); });

function sendHeight(){ try{ var h=Math.ceil(document.body.scrollHeight)+16; window.parent.postMessage({type:'acx-diagram-height', height:h}, '*'); }catch(e){} }
window.addEventListener('load', function(){ sendHeight(); try{ window.parent.postMessage({type:'acx-diagram-ready'}, '*'); }catch(e){} });
window.addEventListener('resize', sendHeight);
if(window.ResizeObserver){ new ResizeObserver(sendHeight).observe(document.body); }
setPhase(0);
setTimeout(sendHeight,300); setTimeout(sendHeight,1000);
</script>
</body>
</html>
