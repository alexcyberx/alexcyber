<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NovaSat Internal Portal :: AlexCyberX</title>
<style>
  :root{
    --bg: #060a0c;
    --panel: #0b1417;
    --panel-2: #101c20;
    --line: rgba(255,255,255,0.08);
    --ink: #eef6f7;
    --ink-dim: #7d9498;
    --accent: #22b8cf;
    --accent-2: #0891b2;
    --good: #2fbf71;
    --bad: #f0555a;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --body: 'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:14px; line-height:1.5;
  }
  a{ color:inherit; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:14.5px; }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .env-tag{
    font-family:var(--mono); font-size:10.5px; color:var(--accent);
    border:1px solid rgba(34,184,207,0.3); background:rgba(34,184,207,0.08);
    padding:3px 9px; border-radius:5px;
  }

  .wrap{ max-width:560px; margin:0 auto; padding:48px 20px 60px; }

  .head{ margin-bottom:22px; }
  .head h1{ font-size:20px; margin:0; font-weight:700; }
  .head p{ font-size:13px; color:var(--ink-dim); margin:8px 0 0; line-height:1.65; }

  .card{
    margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .card-row{ padding:16px 18px; border-bottom:1px solid var(--line); }
  .card-row:last-child{ border-bottom:none; }
  .label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }

  .session-empty{ font-size:12.5px; color:var(--ink-dim); }

  .kv-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; }
  .kv-row .k{ color:var(--ink-dim); }
  .kv-row .v{ font-family:var(--mono); font-weight:600; }
  .v.role-user{ color:var(--ink); }
  .v.role-admin{ color:var(--good); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:11px 16px; border-radius:8px; border:none; cursor:pointer;
    font-family:var(--body); font-weight:600; font-size:13px;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#03181c; }
  .btn-primary:hover{ filter:brightness(1.07); }
  .btn-secondary{ background:var(--panel-2); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ border-color:var(--accent); color:var(--accent); }
  .btn:disabled{ opacity:0.55; cursor:default; }

  .result{ margin-top:12px; font-size:12.5px; padding:10px 12px; border-radius:7px; display:none; line-height:1.6; }
  .result.show{ display:block; }
  .result.ok{ background:rgba(47,191,113,0.08); border:1px solid rgba(47,191,113,0.3); color:var(--good); }
  .result.err{ background:rgba(240,85,90,0.08); border:1px solid rgba(240,85,90,0.3); color:var(--bad); }
  .result .flagline{
    display:block; margin-top:8px; font-family:var(--mono); font-size:13px;
    color:var(--good); word-break:break-all; user-select:all;
  }

  .cookie-hint{
    margin-top:14px; font-size:11.5px; color:var(--ink-dim); line-height:1.6;
    border-top:1px dashed var(--line); padding-top:12px;
  }
  .cookie-hint code{
    font-family:var(--mono); background:var(--panel-2); padding:1px 5px; border-radius:4px; font-size:11px;
  }
</style>
</head>
<body data-lab-id="web-06">

<div class="topbar">
  <div class="brand"><span class="dot"></span> <span data-i18n="brand">NovaSat Internal Portal</span></div>
  <div class="env-tag">STAGING</div>
</div>

<div class="wrap">
  <div class="head">
    <h1 data-i18n="h1">Member Area</h1>
    <p data-i18n="intro">Log in as a guest to get a session, then check your access level below.</p>
  </div>

  <div class="card">
    <div class="card-row">
      <div class="label" data-i18n="session">Session</div>
      <div id="sessionBox" class="session-empty" data-i18n="not_in">Not logged in.</div>
    </div>
    <div class="card-row">
      <button class="btn btn-primary" id="loginBtn" type="button" data-i18n="login">Log In As Guest</button>
    </div>
    <div class="card-row">
      <button class="btn btn-secondary" id="checkBtn" type="button" data-i18n="check">Check Access</button>
      <div class="result" id="resultEl"></div>
    </div>
  </div>

  <div class="cookie-hint" data-i18n-html="hint">
    Session state is kept in a browser cookie named <code>acx_session</code>. The server trusts whatever it reads back from it.
  </div>
</div>

function getSession() {
  const params = new URLSearchParams(window.location.search);
  return params.get('session') || '';
}

function getChallengeId() {
  return 'web-06';
}

function checkStillActive() {
  try {
    const active = localStorage.getItem('acx_active_challenge');
    if (active && active !== getChallengeId()) {
      // Another challenge is now the active one, but we don't hard-block here
      // since this lab has no timed instance to invalidate mid-use.
    }
  } catch (e) {}
}
checkStillActive();

function readCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function renderSession() {
  const raw = readCookie('acx_session');
  const box = document.getElementById('sessionBox');
  if (!raw) {
    box.innerHTML = '<span class="session-empty"></span>';
    box.firstChild.textContent = t('not_in');
    return;
  }
  box.innerHTML =
    '<div class="kv-row"><span class="k">cookie</span><span class="v" style="font-size:11px;">' + escapeHtml(raw) + '</span></div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function login() {
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = t('logging');
  try {
    const res = await fetch('/api/lab/deserialize/init?session=' + encodeURIComponent(getSession()) + '&lang=' + t.lang, {
      credentials: 'include',
      headers: { 'X-Lab-Session': getSession() }
    });
    if (res.ok) renderSession();
  } catch (e) {
    console.warn('[Deserialize] login failed', e);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function checkAccess() {
  const btn = document.getElementById('checkBtn');
  const box = document.getElementById('resultEl');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = t('checking');
  try {
    const res = await fetch('/api/lab/deserialize/check?session=' + encodeURIComponent(getSession()) + '&lang=' + t.lang, {
      credentials: 'include',
      headers: { 'X-Lab-Session': getSession() }
    });
    const data = await res.json();

    if (!res.ok || !data.authenticated) {
      box.className = 'result show err';
      box.textContent = data.error || t('not_yet');
      return;
    }

    if (data.role === 'admin') {
      box.className = 'result show ok';
      box.innerHTML = escapeHtml(t('lvl_admin')) + '<span class="flagline">' + escapeHtml(data.flag) + '</span>';
    } else {
      box.className = 'result show err';
      box.textContent = t('lvl_user');
    }
  } catch (e) {
    console.warn('[Deserialize] check failed', e);
    box.className = 'result show err';
    box.textContent = t('no_server');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('checkBtn').addEventListener('click', checkAccess);

renderSession();
</script>
