<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz @alex.cyberx</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* Theme-aware chapter quiz (green / blue / red), set via ?theme= and a parent
   postMessage, matching the course diagrams. Reads the question set from ?set=. */
:root{
  --acc:#10b981; --acc2:#34d399; --acc-rgb:16,185,129; --bg:#0b0d0d;
  --text:#d7dcda; --dim:#8b938f; --faint:#5c6460;
  --surface:rgba(255,255,255,0.03); --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --ok:#10b981; --ok-rgb:16,185,129; --no:#9aa29d; --no-rgb:154,162,157;
}
[data-theme="blue"]{ --acc:#2f86e6; --acc2:#5aa2f0; --acc-rgb:47,134,230; --bg:#070d1a; --text:#cdd8e8; --dim:#8695ab; --line:rgba(140,180,255,0.12); --line2:rgba(140,180,255,0.2); --ok:#2f86e6; --ok-rgb:47,134,230; }
[data-theme="red"]{ --acc:#dc1414; --acc2:#ff5a5a; --acc-rgb:220,20,20; --bg:#060608; --text:#d4cdcd; --dim:#9a8f8f; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.15); --ok:#2fae6a; --ok-rgb:47,174,106; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);padding:4px 2px 8px;overflow:hidden;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.badge{display:flex;align-items:center;gap:8px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--acc);text-transform:uppercase;}
.count{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:16px;}
.bar > i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s ease;}
.q{font-size:15px;font-weight:600;color:#f2f5f4;line-height:1.5;margin-bottom:14px;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--text);font:500 13.5px 'Inter',sans-serif;line-height:1.45;transition:all .15s;}
.opt:hover:not(:disabled){border-color:var(--line2);background:rgba(255,255,255,0.04);}
.opt:disabled{cursor:default;}
.opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono',monospace;color:var(--dim);margin-top:1px;}
.opt.correct{border-color:rgba(var(--ok-rgb),0.6);background:rgba(var(--ok-rgb),0.1);color:#f2f5f4;}
.opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#06130d;}
.opt.wrong{border-color:rgba(var(--no-rgb),0.6);background:rgba(var(--no-rgb),0.1);color:var(--text);}
.opt.wrong .mk{border-color:var(--no);color:var(--no);}
.explain{margin-top:13px;font-size:12.5px;line-height:1.6;color:var(--dim);border-left:2px solid var(--line2);padding-left:11px;display:none;}
.explain.show{display:block;}
.explain b{color:#f2f5f4;font-weight:600;}
.foot{margin-top:16px;display:flex;justify-content:flex-end;}
.btn{background:rgba(var(--acc-rgb),0.12);border:1px solid rgba(var(--acc-rgb),0.4);color:var(--acc2);font:700 13px 'Inter',sans-serif;border-radius:9px;padding:9px 18px;cursor:pointer;transition:all .15s;}
.btn:hover{background:rgba(var(--acc-rgb),0.2);}
.btn[disabled]{opacity:.4;cursor:default;}
.result{text-align:center;padding:10px 4px;}
.score{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:34px;color:var(--acc);line-height:1;}
.result p{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5;}
.result .btn{margin-top:16px;display:inline-block;}
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
var QUIZZES = {
  recon: {
    title: 'Recon quiz',
    questions: [
      { q: 'Reconnaissance ek attack ke kis stage par hota hai?',
        options: ['Sabse pehle, attack karne se bhi pehle', 'Attack ke beech mein', 'Sirf attack ke baad', 'Kabhi nahi, ye zaroori nahi'],
        answer: 0,
        explain: 'Recon <b>pehla step</b> hai. Attacker pehle target ke baare mein jitni ho sake utni information gather karta hai, tabhi wo decide karta hai ki kahan aur kaise attack karna hai.' },
      { q: 'In mein se kaunsa <b>passive</b> reconnaissance ka example hai?',
        options: ['Nmap se target ke ports scan karna', 'Target ki public LinkedIn, WHOIS aur website dekhna', 'Login page par passwords brute force karna', 'Server ko requests se flood karna'],
        answer: 1,
        explain: 'Passive recon mein attacker target ko <b>chhuye bina</b> public information collect karta hai (LinkedIn, WHOIS, Google). Target ko pata hi nahi chalta. Nmap scanning <b>active</b> recon hai.' },
      { q: 'Active recon attacker ke liye risky kyun hai?',
        options: ['Wo hamesha fail hota hai', 'Wo target ko directly touch karta hai, isliye logs mein dikh sakta hai aur detect ho sakta hai', 'Usme koi tool nahi lagta', 'Wo sirf raat ko kaam karta hai'],
        answer: 1,
        explain: 'Active recon (port scan, directory brute force) target ke system se <b>seedha interact</b> karta hai, to ye server logs aur IDS/firewall mein <b>record aur detect</b> ho sakta hai.' },
      { q: 'Ek defender apna <b>attack surface</b> kaise chhota kare?',
        options: ['Sirf ek strong password rakh ke', 'Public info kam karke: WHOIS privacy, GitHub mein secrets na daal ke, unused ports band karke', 'Antivirus install karke', 'Site ka colour badal ke'],
        answer: 1,
        explain: 'Attacker ke paas jitni kam information hogi, utna mushkil. <b>WHOIS privacy</b>, GitHub mein koi secret na, unused services/ports band, aur scanning ko monitor/rate-limit karna attack surface chhota karta hai.' },
    ],
  },
};

var params = new URLSearchParams(location.search);
var setName = params.get('set') || 'recon';
var QUIZ = QUIZZES[setName] || QUIZZES.recon;
var i = 0, score = 0, answered = false;

function render(){
  var card = document.getElementById('card');
  if (i >= QUIZ.questions.length){
    var pct = Math.round(score / QUIZ.questions.length * 100);
    var msg = pct === 100 ? 'Perfect! Sab sahi.' : pct >= 50 ? 'Achha! Ek baar chapter dobara dekh lo.' : 'Koi baat nahi, chapter padho aur phir se try karo.';
    card.innerHTML = '<div class="result"><div class="score">'+score+' / '+QUIZ.questions.length+'</div><p>'+msg+'</p><button class="btn" onclick="restart()">Phir se karo</button></div>';
    sendHeight(); return;
  }
  var qn = QUIZ.questions[i]; answered = false;
  var letters = ['A','B','C','D','E'];
  var opts = qn.options.map(function(o,idx){
    return '<button class="opt" data-idx="'+idx+'" onclick="pick('+idx+')"><span class="mk">'+letters[idx]+'</span><span>'+o+'</span></button>';
  }).join('');
  card.innerHTML =
    '<div class="top"><div class="badge">'+quizIcon()+' Quick quiz</div><div class="count">Q'+(i+1)+' / '+QUIZ.questions.length+'</div></div>'+
    '<div class="bar"><i style="width:'+(i/QUIZ.questions.length*100)+'%"></i></div>'+
    '<div class="q">'+qn.q+'</div>'+
    '<div class="opts">'+opts+'</div>'+
    '<div class="explain" id="explain">'+qn.explain+'</div>'+
    '<div class="foot"><button class="btn" id="nextBtn" disabled onclick="next()">'+(i===QUIZ.questions.length-1?'Result':'Next')+'</button></div>';
  sendHeight();
}
function quizIcon(){ return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="var(--acc)" stroke-width="1.4"/><path d="M6 6.2a2 2 0 1 1 2.6 1.9c-.4.15-.6.4-.6.8v.4" stroke="var(--acc)" stroke-width="1.4" stroke-linecap="round" fill="none"/><circle cx="8" cy="11.6" r="0.9" fill="var(--acc)"/></svg>'; }

function pick(idx){
  if (answered) return; answered = true;
  var qn = QUIZ.questions[i];
  if (idx === qn.answer) score++;
  var btns = document.querySelectorAll('.opt');
  btns.forEach(function(b){
    var bi = parseInt(b.getAttribute('data-idx'),10);
    b.disabled = true;
    if (bi === qn.answer) b.classList.add('correct');
    else if (bi === idx) b.classList.add('wrong');
  });
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').disabled = false;
  sendHeight();
}
function next(){ i++; render(); }
function restart(){ i = 0; score = 0; render(); }

function applyTheme(t){ if(t==='blue'||t==='red'||t==='green'){ document.documentElement.setAttribute('data-theme', t==='green'?'':t); } }
(function(){ try{ var m=location.search.match(/theme=(green|blue|red)/); if(m) applyTheme(m[1]); }catch(e){} })();
window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='acx-theme') applyTheme(d.theme); });

function sendHeight(){ try{ var h=Math.ceil(document.body.scrollHeight)+8; window.parent.postMessage({type:'acx-diagram-height', height:h}, '*'); }catch(e){} }
window.addEventListener('load', function(){ sendHeight(); try{ window.parent.postMessage({type:'acx-diagram-ready'}, '*'); }catch(e){} });
window.addEventListener('resize', sendHeight);
if(window.ResizeObserver){ new ResizeObserver(sendHeight).observe(document.body); }
render();
setTimeout(sendHeight,300); setTimeout(sendHeight,1000);
</script>
</body>
</html>
